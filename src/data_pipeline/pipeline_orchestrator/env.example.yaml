# env.example.yaml — template for the per-machine environment file.
#
# Copy this to env.yaml (which is GITIGNORED) and edit for your machine:
#     cp env.example.yaml env.yaml
#
# Two-file model (see docs/refactors/streamline-snakemake/well_id_throughline_refactor_plan.md,
# Scope 3): config.yaml holds the SCIENCE (what to run, committed); env.yaml holds the
# ENVIRONMENT (where/how it runs on THIS machine, gitignored). Keeping machine paths and the
# interpreter out of config.yaml is what lets the same workflow run unedited on any machine.
#
# The pipeline LAYOUT beneath each root (e.g. {stage}/{experiment}/per_well/{well_id}/...) is a
# CODE contract and is NOT configured here — only the roots themselves are environment.

runtime:
  # Conda environment NAME — resolved at run time via `conda run -n <name>`. We pin the env by
  # name (not a hardcoded /.../bin/python path) so the workflow is portable to any machine that
  # has this conda environment, and so it obeys the repo rule "never bare python / conda activate".
  conda_env: "segmentation_grounded_sam"
  # Absolute path to the conda installation base (output of: conda info --base).
  # Required so Snakemake rule subshells can find `conda run` without relying on PATH.
  conda_base: "<output of: conda info --base>"
  # NOTE: snakemake 7.32.4 requires pulp<2.8 (pulp 2.8+ removed list_solvers; snakemake
  # PR #3511). If snakemake fails with "module 'pulp' has no attribute 'list_solvers'", run:
  #   pip install "pulp<2.8"  (inside the conda env)
  # Compute device for GPU stages (image building, segmentation, auxiliary masks).
  device: "cuda"

  # ── Legacy representation-model (VAE) interpreter ───────────────────────────────────────────
  # The legacy VAE encoder is Python-3.9-pinned (its custom encoder/decoder pickles do not
  # survive 3.9 → 3.10). The embeddings stage therefore runs its WHOLE command body in Python 3.9;
  # the main pipeline (3.10) only schedules the job and validates the output file. ONLY FILES
  # cross the env boundary — no model object ever does. (See specs/model_input_handoff_contract.md §9.)
  # PREFERRED: a direct absolute path to the 3.9 interpreter — skips the conda-run shell layer.
  model_python_executable: "<abs path to .../envs/mseq_pipeline_py3.9/bin/python>"
  # FALLBACK: if model_python_executable is absent, the model step uses `conda run -n <env> …`.
  model_python_env: "mseq_pipeline_py3.9"

paths:
  # All three roots are first-class ABSOLUTE paths. Inputs and model weights typically live on
  # shared read-only volumes; outputs are churning scratch you write constantly — so they are
  # decoupled here rather than forced under one root.
  input_root:  "<path to morphseq inputs>"   # read-only source data (raw images, plate sheets)
  output_root: "<path to morphseq outputs>"  # pipeline results — the "data output route"
  # models_root holds large static model weights. Segmentation models live directly under it
  # (GroundingDINO/, sam2/, segmentation/); the legacy VAE lives at models_root/legacy/<model_name>/
  # (the layout AutoModel.load_from_folder expects: model_config.json + model.pt + optional
  # encoder.pkl/decoder.pkl; a nested final_model/ subdir is tolerated).
  models_root: "<path to morphseq models>"   # large static model weights (GroundingDINO, SAM2, UNet, legacy VAE)

resources:
  default_threads: 4
  default_mem_mb: 16000
