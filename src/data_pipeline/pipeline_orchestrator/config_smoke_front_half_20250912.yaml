# DEVELOPMENT SMOKE CONFIG — explicit partial/debug run of the front_half spine.
#
# This is NOT the production config. It exists so the 2-well x first-3-frames smoke of the live
# materialize_well -> validate_frame_inventory branch has a named, committed home, keeping the main
# config.yaml inert (device: auto, smoke_max_time_indices: 0, no target_wells).
#
# Run it as an OVERLAY on the main config (later --configfile keys update earlier ones):
#   snakemake --configfile config_smoke_front_half_20250912.yaml front_half --rerun-triggers mtime --cores 1
#
# Notes (learned from the 2026-06-18 smoke):
#   - --rerun-triggers mtime: avoid re-running the expensive ND2 ingest on provenance triggers.
#   - --cores 1: two parallel ND2 loads on CPU can OOM; run wells serially.
#   - device resolves via the main config's image_building.device: "auto" -> CPU on a no-GPU box,
#     announced as AUTO_MODE_CHOSEN. The cap announces itself as SMOKE_FRAME_CAP_ACTIVE.

# Restrict the front_half fan to two wells (intersected with discovered_wells.txt; fails loud on a
# well not physically discovered).
target_wells:
  20250912:
    - B01
    - C01

# Activate the development-only smoke cap (see the loud note in config.yaml). First 3 time_index
# values per well. NOT a frame-selection policy.
image_materialization:
  smoke_max_time_indices: 3
