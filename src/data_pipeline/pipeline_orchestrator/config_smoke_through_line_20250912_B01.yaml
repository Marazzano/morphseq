# DEVELOPMENT SMOKE CONFIG — Tier 1 DEPTH proof of the data-flow through-line.
#
# One YX1 well (20250912_B01), one timepoint, raw ND2 -> the per-snip `snip_qc` verdict. This is
# the DEPTH leg of the tiered data-flow test plan: cross EVERY inter-stage seam once, on a single
# well, on CPU. It is NOT production and NOT the width/agnostic proof.
#
#   docs/refactors/streamline-snakemake/target/specs/data_flow_test_plan.md  (Tier 1)
#
# Run it as an OVERLAY on the main config (later --configfile keys update earlier ones), targeting
# the `through_line` rule (the named REQUEST for snip_qc; `rule all` stops at merged frame_masks):
#   cd src/data_pipeline/pipeline_orchestrator
#   snakemake --configfile config.yaml \
#     --configfile config_smoke_through_line_20250912_B01.yaml \
#     through_line --rerun-triggers mtime --cores 1
#
# Notes:
#   - Tier 1 is a CPU run: one well / one timepoint is small enough that the
#     detection/segmentation/projection legs run on CPU. No GPU node required for the depth proof.
#     There is a HARD GPU GATE between Tier 1 and Tier 2 — do not fan to all wells (Tier 2) until
#     mdcolon has verified the Tier-1 through-line result + change log.
#   - --rerun-triggers mtime: avoid re-running the expensive ND2 ingest on provenance triggers.
#   - --cores 1: serialize; keeps the depth run on one well deterministic and CPU-friendly.
#   - The timepoint limiter is `smoke_max_time_indices` (config-only — never an ad-hoc
#     `if time_index == 0` inside a stage). It caps the materialized frame inventory at the
#     backend, and the whole per-frame downstream chain derives from that inventory, so one
#     timepoint propagates cleanly raw -> snip_qc with no stage-buried filter.

# Pin the through-line fan to ONE well (intersected with discovered_wells.txt; fails loud on a well
# not physically discovered). B01 is chosen because both image products are already proven on it.
target_wells:
  20250912:
    - B01

# One timepoint (first time_index per well). Development-only cap (see the loud note in config.yaml);
# NOT a frame-selection policy.
image_materialization:
  smoke_max_time_indices: 1

# Keep the snip UNet on CPU for the depth proof (no GPU node for Tier 1).
unet_snip:
  device: cpu
