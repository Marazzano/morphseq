[pytest]
# --import-mode=importlib is REQUIRED for this tree (see tests/README.md): the test tree
# mirrors the package tree and would otherwise assemble a shadowing `data_pipeline` namespace
# rooted in tests/, breaking submodule imports. Pinning it here means the bare `pytest tests/`
# invocation works without remembering the flag.
#
# -m "not legacy_drift" QUARANTINES the real-data drift benchmarks
# (tests/data_pipeline/**/_legacy_drift/) out of the default suite. Those benchmarks read large
# legacy playground artifacts by absolute path, take minutes, and for flag-directional products
# report-for-sign-off rather than asserting; the default unit run must stay fast and must NOT
# hard-fail on an expected-pending-review divergence. Run them explicitly with `-m legacy_drift`.
addopts = --import-mode=importlib -m "not legacy_drift"

markers =
    legacy_drift: real-data pilot-continuity benchmark vs the legacy build pipeline; deselected by default (run with `-m legacy_drift`).
